name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"
      - name: Unzip project
        run: unzip -o "$(ls *.zip | head -1)" -d work
      - name: Build
        working-directory: work/ClearPath
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ClearPath-apk
          path: work/ClearPath/app/build/outputs/apk/debug/app-debug.apk
